# =============================================================================
# AI 数字化咨询中心 - Docker Compose
# 一键启动：app (Node/Express + 静态前端) + postgres (pgvector)
# =============================================================================

version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-center-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_consult
      POSTGRES_USER: ai_center
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 初始化时执行迁移与启用扩展
      - ./data/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_center} -d ${POSTGRES_DB:-ai_consult}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-center-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-demo}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_center}:${POSTGRES_PASSWORD:-change_me_strong_password}@postgres:5432/${POSTGRES_DB:-ai_consult}
      JWT_SECRET: ${JWT_SECRET:-please_change_to_a_long_random_secret}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      # 容器内允许 cgroup 检查被绕过，避免 systemd-only 校验阻塞启动
      AI_CENTER_RUNTIME_OWNER: docker
    volumes:
      # 业务数据 / 上传 / 模板 / 配置持久化
      - app-data:/app/data
      - app-uploads:/app/data/uploads
      - app-templates:/app/templates
      # 可选：把生产 .env 挂到容器
      - ./config/.env:/app/.env:ro
    ports:
      - "${APP_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
  app-data:
  app-uploads:
  app-templates:
